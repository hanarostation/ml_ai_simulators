<!-- TensorFlow.js가 필요하면 아래 줄의 주석을 풉니다 (공용 파일, 약 1.4MB) -->
<!-- <script src="../../assets/vendor/tf.min.js"></script> -->
<script>
(function () {
  "use strict";
  const $ = id => document.getElementById(id);
  /* 안쪽 탭 (URL 해시 연동, ←/→ 키 이동) */
  const tabs = [...document.querySelectorAll(".sk-tab")];
  function show(t) {
    tabs.forEach(b => { const on = b === t; b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1;
      document.getElementById(b.getAttribute("aria-controls")).hidden = !on; });
    history.replaceState(null, "", "#" + t.id.replace("tab-", ""));
  }
  tabs.forEach((b, i) => {
    b.addEventListener("click", () => show(b));
    b.addEventListener("keydown", e => {
      const d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0; if (!d) return;
      const n = tabs[(i + d + tabs.length) % tabs.length]; show(n); n.focus(); e.preventDefault();
    });
  });
  const start = document.getElementById("tab-" + location.hash.slice(1)); if (start) show(start);

  $("btnRun").onclick = () => { $("out").textContent = "실행했습니다."; };
  $("btnReset").onclick = () => { $("out").textContent = "여기에 시뮬레이터 내용을 작성합니다."; };
})();
</script>
