<style>
/* ---------- 메인 페이지 전용 ---------- */
.home { max-width: var(--max); width: 100%; margin: 0 auto; padding: 0 var(--gutter) 56px; }

.intro { padding: 44px 0 28px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px 40px; align-items: end; }
.intro__eyebrow { margin: 0 0 12px; font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
.intro__title { margin: 0; font-size: 40px; line-height: 1.15; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
.intro__title span { color: var(--muted); font-weight: 600; }
.intro__lede { margin: 14px 0 0; color: var(--muted); font-size: 16px; max-width: 62ch; }
.intro__stats { display: flex; gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; min-width: 104px; }
.stat b { display: block; font-family: var(--mono); font-size: 26px; line-height: 1.1; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); font-weight: 600; }

/* 탭 */
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; }
.tab {
  appearance: none; font: inherit; cursor: pointer; border: 1px solid transparent; background: transparent; color: var(--muted);
  border-radius: 10px; padding: 11px 14px; display: flex; align-items: center; justify-content: center; gap: 9px;
  font-size: 15px; font-weight: 700; min-width: 0; transition: background .15s, color .15s;
}
.tab .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.tab > span:nth-child(2) { white-space: nowrap; }
.tab .en { font-size: 12px; font-weight: 600; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab .count { font-family: var(--mono); font-size: 12px; font-weight: 600; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 10px; display: inline-grid; place-items: center; background: var(--line); color: var(--muted); }
.tab:hover { color: var(--ink); background: color-mix(in srgb, var(--surface) 60%, transparent); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); border-color: var(--line); box-shadow: var(--shadow); }
.tab[aria-selected="true"] .count { background: var(--c); color: var(--on-ink); }
.tab:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.panel { padding-top: 26px; }
.panel__head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; margin-bottom: 16px; }
.panel__head h2 { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 10px; }
.panel__head h2::before { content: ""; width: 4px; height: 20px; border-radius: 2px; background: var(--c); }
.panel__head p { margin: 0; color: var(--muted); font-size: 14px; max-width: 70ch; }

/* 카드 */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; list-style: none; margin: 0; padding: 0; }
.card {
  position: relative; display: flex; flex-direction: column; height: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  text-decoration: none; color: var(--ink); overflow: hidden;
  transition: transform .18s, box-shadow .18s, border-color .18s;
}
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); border-color: color-mix(in srgb, var(--c) 45%, var(--line)); }
.card:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.card__art { height: 132px; display: grid; place-items: center; color: var(--c); background:
  radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--c) 16%, transparent), transparent 60%),
  color-mix(in srgb, var(--c) 6%, var(--surface-2)); border-bottom: 1px solid var(--line); }
.card__art svg { width: 190px; height: 100px; }
.card__body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.card__cat { font-size: 12px; font-weight: 700; color: var(--c); letter-spacing: .02em; }
.card__title { margin: 0; font-size: 19px; line-height: 1.3; font-weight: 700; }
.card__sum { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.tags span { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; }
.card__foot { margin-top: auto; padding-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px dashed var(--line); }
.card__req { font-size: 12px; color: var(--faint); font-weight: 600; min-width: 0; }
.card__go { flex: none; white-space: nowrap; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.card__go svg { width: 16px; height: 16px; transition: transform .18s; }
.card:hover .card__go svg { transform: translateX(3px); }

.empty {
  border: 1.5px dashed var(--line-strong); border-radius: var(--radius); padding: 44px 24px; text-align: center;
  color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; background: color-mix(in srgb, var(--surface) 55%, transparent);
}
.empty__icon { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 12%, var(--surface)); }
.empty__icon svg { width: 24px; height: 24px; }
.empty b { color: var(--ink); font-size: 17px; }
.empty p { margin: 0; font-size: 14px; max-width: 52ch; }

@media (max-width: 1180px) { .tab .en { display: none; } }
@media (max-width: 900px) {
  .intro { grid-template-columns: minmax(0, 1fr); padding-top: 32px; }
  .intro__title { font-size: 32px; }
  .tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 520px) {
  .intro__title { font-size: 27px; }
  .intro__stats .stat { flex: 1; min-width: 0; }
  .tab { padding: 10px 8px; font-size: 14px; }
  .tab .en { display: none; }
  .cards { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { .card, .card__go svg, .tab { transition: none; } .card:hover { transform: none; } }
</style>

  CATS.forEach(function (c) {
    var list = SIMS.filter(function (s) { return s.category === c.id; });
    tabsHtml += '<button class="tab" role="tab" type="button" id="tab-' + c.id + '" aria-controls="panel-' + c.id + '" aria-selected="false" tabindex="-1" data-cat="' + c.id + '" style="--c:var(--cat-' + c.id + ')">' +
      '<span class="dot" aria-hidden="true"></span><span>' + esc(c.label) + '</span><span class="en">' + esc(c.en) + '</span><span class="count" aria-label="' + list.length + '개">' + list.length + '</span></button>';
    panelsHtml += '<section class="panel" role="tabpanel" id="panel-' + c.id + '" aria-labelledby="tab-' + c.id + '" hidden style="--c:var(--cat-' + c.id + ')">' +
      '<div class="panel__head"><h2>' + esc(c.label) + '</h2><p>' + esc(c.blurb) + '</p></div>' +
      (list.length
        ? '<ul class="cards">' + list.map(function (s) { return card(s, c); }).join("") + '</ul>'
        : '<div class="empty"><div class="empty__icon">' + EMPTY_ICON + '</div><b>시뮬레이터 준비 중입니다</b><p>' + esc(c.label) + ' 분야의 시뮬레이터가 곧 추가됩니다.</p></div>') +
      '</section>';
  });
  tabsEl.innerHTML = tabsHtml;
  panelsEl.innerHTML = panelsHtml;
  document.getElementById("statSims").textContent = SIMS.length;
  document.getElementById("statCats").textContent = CATS.length;

  var ids = CATS.map(function (c) { return c.id; });
  function firstFilled() {
    for (var i = 0; i < CATS.length; i++) if (SIMS.some(function (s) { return s.category === CATS[i].id; })) return CATS[i].id;
    return ids[0];
  }
  function select(id, focus) {
    if (ids.indexOf(id) < 0) id = firstFilled();
    ids.forEach(function (k) {
      var on = k === id, t = document.getElementById("tab-" + k);
      t.setAttribute("aria-selected", on ? "true" : "false");
      t.tabIndex = on ? 0 : -1;
      document.getElementById("panel-" + k).hidden = !on;
      var a = document.querySelector('.ds-nav a[href="#' + k + '"]');
      if (a) { if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); }
    });
    if (focus) document.getElementById("tab-" + id).focus();
  }
  function fromHash() { return (location.hash || "").replace("#", ""); }

  tabsEl.addEventListener("click", function (e) {
    var b = e.target.closest(".tab"); if (!b) return;
    var id = b.getAttribute("data-cat");
    if (history.replaceState) history.replaceState(null, "", "#" + id);
    select(id);
  });
  tabsEl.addEventListener("keydown", function (e) {
    var cur = ids.indexOf(document.activeElement && document.activeElement.getAttribute("data-cat"));
    if (cur < 0) return;
    var n = null;
    if (e.key === "ArrowRight") n = (cur + 1) % ids.length;
    else if (e.key === "ArrowLeft") n = (cur - 1 + ids.length) % ids.length;
    else if (e.key === "Home") n = 0;
    else if (e.key === "End") n = ids.length - 1;
    if (n === null) return;
    e.preventDefault();
    if (history.replaceState) history.replaceState(null, "", "#" + ids[n]);
    select(ids[n], true);
  });
  window.addEventListener("hashchange", function () {
    select(fromHash());
    document.getElementById("tabs").scrollIntoView({ block: "nearest" });
  });
  select(fromHash());
})();
</script>
</body>
</html>
